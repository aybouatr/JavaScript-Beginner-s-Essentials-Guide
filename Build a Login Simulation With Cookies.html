<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


<style>

    body 
    {
        height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #f0f2f5;
        font-family: Arial, sans-serif;
    }

    .container 
    {
        background: white;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 360px;
    }

      h2 {
        margin-bottom: 20px;
        color: #333;
      }

      h4
      {
        color: #0056b3;
        margin-bottom: 20px;

      }

      input {
        padding: 12px;
        width: 100%;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 1rem;
      }

      button {
        width: 100%;
        padding: 12px;
        margin: 6px 0;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s ease;
      }

      button:hover {
        background: #0056b3;
        transform: scale(1.03);
      }

      #result {
        margin-top: 20px;
        padding: 10px;
        font-size: 1rem;
        color: #222;
        background: #f8f9fa;
        border-radius: 8px;
        min-height: 40px;
        width: 100%;
        word-wrap: break-word;
        text-align: left;
        border: 1px solid #ddd;
      }

</style>


<body>


    <div class="container"> 
        
        <h1>Login</h1>
            <h4>Enter Name</h4>
        <input class="input" ></input>
            <h4>Enter Email</h4>

        <input class="input" ></input>
            <h4>Enter Password</h4>

        <input class="input" ></input>

        <button>Login</button>
        <button>Save Cookie</button>
        <button>Delete Cookie</button>


    </div>
    
</body>
</html>
