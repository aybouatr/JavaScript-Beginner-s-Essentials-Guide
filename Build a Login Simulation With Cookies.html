<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cookies Activity</title>

    <style>

        body {
            min-height: 100vh;

            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f0f2f5;

            font-family: Arial, sans-serif;
        }

        .container {
            background: white;

            padding: 30px 40px;

            border-radius: 12px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.1);

            text-align: center;

            width: 360px;
        }

        h1 {
            margin-bottom: 20px;

            color: #333;
        }

        h4 {
            color: #0056b3;

            margin-bottom: 10px;

            text-align: left;
        }

        input {
            padding: 12px;

            width: 100%;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 1rem;

            box-sizing: border-box;
        }

        input:focus {
            outline: none;

            border-color: #007bff;

            box-shadow:
                0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        button {
            width: 100%;

            padding: 12px;

            margin: 6px 0;

            background: #007bff;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 1rem;

            cursor: pointer;

            transition: 0.3s ease;
        }

        button:hover {
            background: #0056b3;

            transform: scale(1.03);
        }

        .delete {
            background: #dc3545;
        }

        .delete:hover {
            background: #b02a37;
        }

        #result {
            margin-top: 20px;

            padding: 10px;

            font-size: 1rem;

            color: #222;

            background: #f8f9fa;

            border-radius: 8px;

            min-height: 40px;

            width: 100%;

            box-sizing: border-box;

            word-wrap: break-word;

            text-align: left;

            border: 1px solid #ddd;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Login</h1>


        <h4>Enter Name</h4>

        <input
            id="Name"
            class="input"
            type="text"
            placeholder="Enter your name"
        >


        <h4>Enter Email</h4>

        <input
            id="Email"
            class="input"
            type="email"
            placeholder="example@gmail.com"
        >


        <h4>Enter Password</h4>

        <input
            id="Password"
            class="input"
            type="password"
            placeholder="Enter your password"
        >


        <button onclick="Login()">
            Login
        </button>

        <button onclick="SaveCookies()">
            Save Cookie
        </button>

        <button
            class="delete"
            onclick="DeleteCookies()">
            Delete Cookie
        </button>


        <div id="result">
            No cookies loaded.
        </div>

    </div>


    <script>

        // ==========================================
        // GET COOKIE
        // ==========================================

        function getCookie(cookieName)
        {
            const cookies = document.cookie.split(";");

            for (let c of cookies)
            {
                c = c.trim();

                if (c.startsWith(cookieName + "="))
                {
                    return c.substring(cookieName.length + 1);
                }
            }

            return null;
        }


        // ==========================================
        // SAVE COOKIES
        // ==========================================

        function SaveCookies()
        {
            // Get input elements
            const nameInput =
                document.getElementById("Name");

            const emailInput =
                document.getElementById("Email");

            const passwordInput =
                document.getElementById("Password");


            // Get values
            const name = nameInput.value.trim();

            const email = emailInput.value.trim();

            const password = passwordInput.value;


            // Validation
            if (name === "")
            {
                alert("Please enter your name.");

                nameInput.focus();

                return;
            }


            if (!emailInput.checkValidity())
            {
                alert("Please enter a valid email.");

                emailInput.focus();

                return;
            }


            if (password === "")
            {
                alert("Please enter your password.");

                passwordInput.focus();

                return;
            }


            // Create expiration date
            const expiration = new Date();

            expiration.setDate(
                expiration.getDate() + 7
            );


            // Cookie 1
            document.cookie =
                "username=" +
                encodeURIComponent(name) +
                "; expires=" +
                expiration.toUTCString() +
                "; path=/";


            // Cookie 2
            document.cookie =
                "Email=" +
                encodeURIComponent(email) +
                "; expires=" +
                expiration.toUTCString() +
                "; path=/";


            // Cookie 3
            document.cookie =
                "Password=" +
                encodeURIComponent(password) +
                "; expires=" +
                expiration.toUTCString() +
                "; path=/";


            alert("Cookies saved for 7 days!");

            Login();
        }


        // ==========================================
        // LOGIN / SHOW COOKIES
        // ==========================================

        function Login()
        {
            const name =
                getCookie("username");

            const email =
                getCookie("Email");

            const password =
                getCookie("Password");


            const resultBox =
                document.getElementById("result");


            resultBox.innerHTML = `
                <strong>Saved Cookies:</strong>

                <br><br>

                Username:
                ${name ? decodeURIComponent(name) : "❌ Not Found"}

                <br>

                Email:
                ${email ? decodeURIComponent(email) : "❌ Not Found"}

                <br>

                Password:
                ${password ? "********" : "❌ Not Found"}
            `;
        }


        // ==========================================
        // DELETE COOKIES
        // ==========================================

        function DeleteCookies()
        {
            document.cookie =
                "username=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/";

            document.cookie =
                "Email=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/";

            document.cookie =
                "Password=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/";


            // Clear inputs
            document.getElementById("Name").value = "";

            document.getElementById("Email").value = "";

            document.getElementById("Password").value = "";


            // Clear output
            document.getElementById("result").innerHTML =
                "No cookies loaded.";


            alert("Cookies deleted!");
        }

    </script>

</body>

</html>
