<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Loader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Async Data Loader</h1>

        <span>Loads users from a public API. Shows loading, errors, and retry.</span>

        <br><br>

        <button class="btn" id="loadDataBtn">Load Users</button>
        <button class="btnsecondary" disabled id="retryBtn">Retry</button>

        <span class="muted" id="meta"></span>

        <div class="user-data" id="loadingStatus">
            <div class="grid" id="grid"></div>
        </div>

    </div>

    <div class="toast" id="toast">test test</div>

    <script src="index.js"></script>
</body>
</html>
