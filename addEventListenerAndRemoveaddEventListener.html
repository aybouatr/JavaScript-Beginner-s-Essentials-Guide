<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event Listener</title>

    <style>
        :root {
            --gold: #d4af37;
            --gold-dark: #b58f1e;
            --black: #0a0a0a;
            --text-light: #fdf6d5;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: url("tasbeeh-gold.png") no-repeat center center fixed;
            background-color: #080806;
            background-size: cover;

            font-family: "Noto Kufi Arabic", sans-serif;
            color: var(--text-light);

            direction: rtl;
        }

        .box {
            background: linear-gradient(145deg, #111 0%, #000 100%);

            border: 3px solid var(--gold);
            border-radius: 20px;

            box-shadow:
                0 0 25px rgba(212, 175, 55, 0.4),
                inset 0 0 15px rgba(212, 175, 55, 0.2);

            padding: 50px 60px;

            width: 600px;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 20px;

            text-align: center;
        }

        button {
            background: linear-gradient(145deg, #ab6f6f 0%, #000 100%);

            border: 3px solid var(--gold);
            border-radius: 20px;

            box-shadow:
                0 0 25px rgba(212, 175, 55, 0.4),
                inset 0 0 15px rgba(212, 175, 55, 0.2);

            padding: 20px;

            width: 200px;

            color: white;
            font-size: 20px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-5px);

            box-shadow:
                0 0 35px rgba(212, 175, 55, 0.6),
                inset 0 0 20px rgba(212, 175, 55, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="box">

        <button id="btn1">Add</button>

        <button id="btn2">Remove</button>

    </div>

    <script>

        function ShowMessage1()
        {
            alert("Hello From Function Show Message");
        }

       
        function RemoveEvent()
        {
            btn1.removeEventListener("click",ShowMessage1)
            alert("Remove button clicked!");
        }

        const btn1 = document.getElementById("btn1");
        const btn2 = document.getElementById("btn2");

        btn1.addEventListener("click", ShowMessage1);

        btn2.addEventListener("click", RemoveEvent);

    </script>

</body>
</html>
