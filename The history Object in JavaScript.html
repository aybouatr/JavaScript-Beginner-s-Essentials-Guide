<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The history Object in JavaScript</title>

    <style> 
    
    body 
      {
        height: 100vh;
        margin: 0;
        padding: 40px;
        background: #f4f4f4;
        font-family: Arial, sans-serif;
      }

      button {
        padding: 12px 30px;
        font-size: 1.1rem;
        margin-right: 10px;
        margin-bottom: 20px;
        border: none;
        border-radius: 8px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
        transition: 0.3s ease;
      }
    
    </style>

</head>
<body>

    <button onclick="Forward()">Forward</button>
    <button onclick="GoBack()">GoBack</button>
    <div>

    </div>

    <script>

        function Forward()
        {
            window.history.forward();
        }

        function GoBack()
        {
            window.history.back();
        }

    </script>

</body>
</html>
